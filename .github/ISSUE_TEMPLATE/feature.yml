name: Feature request
description: Propose a concrete workflow or runtime capability
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: Describe the developer task and where the current workflow breaks down
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe observable behavior rather than implementation details
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or references
