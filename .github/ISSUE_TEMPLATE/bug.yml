name: Bug report
description: Report a reproducible problem in the desktop application
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: Include the action, observed result, and expected result
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the shortest sequence that reproduces the problem
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Traceframe version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15.1 arm64
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant logs or screenshots
