name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Build macOS Apple Silicon release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt
      - name: Verify release version
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
          const tauriVersion = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const metadata = JSON.parse(execFileSync("cargo", [
            "metadata",
            "--no-deps",
            "--format-version",
            "1",
            "--manifest-path",
            "src-tauri/Cargo.toml",
          ], { encoding: "utf8" }));
          const cargoVersion = metadata.packages[0]?.version;
          const expectedTag = `v${packageVersion}`;
          const actualTag = process.env.GITHUB_REF_NAME;

          if (actualTag !== expectedTag || tauriVersion !== packageVersion || cargoVersion !== packageVersion) {
            console.error(`Release version mismatch: tag=${actualTag}, npm=${packageVersion}, Tauri=${tauriVersion}, Cargo=${cargoVersion}`);
            process.exit(1);
          }
          console.log(`Validated release ${actualTag}`);
          NODE
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-aarch64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --target aarch64-apple-darwin
      - name: Create checksums
        working-directory: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
        run: shasum -a 256 *.dmg > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Traceframe ${{ github.ref_name }}
          body: |
            Traceframe ${{ github.ref_name }} is a public developer preview for Apple Silicon Macs running macOS 12 or later.

            Download the DMG, drag Traceframe to Applications, and use the included `SHA256SUMS.txt` to verify the file. This build is not yet signed or notarized. If macOS blocks the first launch, Control-click the app in Applications and choose **Open**; do not disable Gatekeeper.

            See the [English README](https://github.com/guoyuxin33/traceframe/blob/${{ github.ref_name }}/README.md) or [简体中文说明](https://github.com/guoyuxin33/traceframe/blob/${{ github.ref_name }}/README.zh-CN.md) for installation, capabilities, security boundaries, and development instructions.
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
